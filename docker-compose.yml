version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ed3hub-redis
    ports:
      - "6379:6379"
    networks:
      - ed3hub-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ed3hub-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend-media:/app/media
    env_file:
      - ./.env
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - ed3hub-network
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ed3hub-celery
    command: celery -A core worker -l info
    entrypoint: []
    volumes:
      - .:/app
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - backend
    networks:
      - ed3hub-network
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ed3hub-celery-beat
    command: celery -A core beat -l info
    volumes:
      - .:/app
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - backend
    networks:
      - ed3hub-network
    restart: unless-stopped

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://dev-api.ed3hub.com
        - NEXT_PUBLIC_WS_URL=wss://dev-api.ed3hub.com
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=793067091414-e1k27kr5ub9btdtgmfpd5hfv9svjlht8.apps.googleusercontent.com
    container_name: ed3hub-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://dev-api.ed3hub.com
      - NEXT_PUBLIC_WS_URL=wss://dev-api.ed3hub.com
    depends_on:
      - backend
    networks:
      - ed3hub-network
    restart: unless-stopped

volumes:
  backend-media:

networks:
  ed3hub-network:
    driver: bridge
