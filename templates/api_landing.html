<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ed3Hub API</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin: 0 auto 1.5rem;
      display: block;
      object-fit: contain;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #94a3b8;
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }

    .cards {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: #1e1e2e;
      border: 1px solid #2d2d44;
      border-radius: 16px;
      padding: 2rem 2.5rem;
      width: 220px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #a78bfa;
      box-shadow: 0 8px 32px rgba(167, 139, 250, 0.15);
    }

    .card-icon {
      font-size: 2.25rem;
      margin-bottom: 0.75rem;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .card span {
      font-size: 0.8rem;
      color: #64748b;
    }

    .badge {
      display: inline-block;
      margin-top: 0.6rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-swagger { background: #16a34a22; color: #4ade80; border: 1px solid #4ade8044; }
    .badge-redoc   { background: #2563eb22; color: #60a5fa; border: 1px solid #60a5fa44; }
    .badge-admin   { background: #7c3aed22; color: #a78bfa; border: 1px solid #a78bfa44; }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/media/avatars/ed3hub_logo.png" alt="Ed3Hub Logo" class="logo" onerror="this.style.display='none'" />
    <h1>Ed3Hub API</h1>
    <p>Choose an interface to explore the API</p>

    <div class="cards">
      <a href="/api/docs/" class="card">
        <div class="card-icon">📄</div>
        <h2>Swagger UI</h2>
        <span>Interactive API explorer</span>
        <div><span class="badge badge-swagger">Try it out</span></div>
      </a>

      <a href="/api/redoc/" class="card">
        <div class="card-icon">📘</div>
        <h2>ReDoc</h2>
        <span>Clean API reference docs</span>
        <div><span class="badge badge-redoc">Reference</span></div>
      </a>

      <a href="/admin/" class="card">
        <div class="card-icon">🛡️</div>
        <h2>Admin Panel</h2>
        <span>Django admin dashboard</span>
        <div><span class="badge badge-admin">Unfold</span></div>
      </a>
    </div>

    <footer>Ed3Hub &mdash; v1.0</footer>
  </div>
</body>
</html>
