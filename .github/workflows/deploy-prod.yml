name: Build and Deploy Backend (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REGISTRY: fra.ocir.io
  NAMESPACE: fr9nfbzwaxn7
  IMAGE_NAME: backend

jobs:

  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Django system check
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create minimal .env for CI
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci-only" >> .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=localhost" >> .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env
          echo "DB_NAME=" >> .env

      - name: Run Django system check
        run: python manage.py check

  build-and-push:
    name: Build and push image to OCIR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    name: Scan image for vulnerabilities
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: trivy-results.json
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    name: Deploy to Oracle VPS
    runs-on: ubuntu-latest
    needs: trivy
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        env:
          OCIR_USER: ${{ secrets.OCIR_USERNAME }}
          OCIR_PASS: ${{ secrets.OCIR_AUTH_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OCIR_USER,OCIR_PASS
          script: |
            set -euo pipefail
            cd /opt/ed3hub/prod
            echo "$OCIR_PASS" | docker login fra.ocir.io -u "$OCIR_USER" --password-stdin
            docker compose pull backend
            docker compose up -d --no-deps backend celery celery-beat
            docker image prune -f